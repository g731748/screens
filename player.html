<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>נגן מסך</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Secular+One&display=swap">
<style>
:root{--teal:#0f3d38;--ink:#0f302c;--cream:#fff3d2;--accent:#f08a24}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Heebo',Arial,sans-serif;cursor:none}
#stage{position:fixed;inset:0;container-type:inline-size}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;background:#000 center/contain no-repeat}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.shab{background:var(--teal);color:var(--cream);display:grid;place-items:center;text-align:center}
.shab .in{display:grid;gap:2.4cqw}
.shab h1{margin:0;font-family:'Secular One','Heebo',sans-serif;font-weight:400;font-size:9cqw;color:var(--accent)}
.shab .big{font-size:7cqw;font-weight:900}
.shab .times{display:flex;gap:6cqw;justify-content:center}
.shab .t{border:.3cqw solid var(--accent);border-radius:2cqw;padding:2cqw 4cqw}
.shab .t b{display:block;font-size:9cqw;font-variant-numeric:tabular-nums}
.shab .t span{font-size:2.6cqw}
.shab .d{font-size:2.4cqw;opacity:.85}
#tick{position:fixed;inset:auto 0 0 0;background:var(--teal);color:var(--cream);font-size:2.6cqw;font-weight:700;padding:1cqw 3cqw;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:.3cqw solid var(--accent)}
#msg{position:fixed;inset:0;display:none;place-items:center;align-content:center;gap:2cqw;text-align:center;color:var(--cream);background:var(--teal);padding:5cqw}
#msg .mt{font-family:'Secular One','Heebo',sans-serif;font-size:6cqw;color:var(--accent)}
#msg .ms{font-size:3cqw;opacity:.9}

#stage{transition:none}
body.split #stage{inset:0 26vw 0 0}
body.split .slide:not(.shab){background:#000}
.slide .bgb{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(28px) brightness(.55)}
.slide .fg{position:relative}
.fx-slide .slide{transform:translateX(-5%);transition:opacity .8s,transform .8s}
.fx-slide .slide.on{transform:none}
.fx-zoom .slide{transform:scale(1.05);transition:opacity .8s,transform 1.2s}
.fx-zoom .slide.on{transform:none}
#side{position:fixed;top:0;bottom:0;right:0;width:26vw;background:#0a0f18;color:#fff;display:none;flex-direction:column;gap:1.4vw;padding:1.8vw;border-inline-start:.3vw solid var(--acc,#6c93ff);box-sizing:border-box;overflow:hidden}
body.split #side{display:flex}
#side .logo{display:flex;align-items:center;gap:1vw;font-weight:900;font-size:2vw}
#side .logo i{flex:none;width:3.4vw;height:3.4vw;border-radius:.8vw;background:var(--acc,#6c93ff);display:grid;place-items:center;font-style:normal;color:#fff;font-size:2vw}
#side .logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side .clock{font-size:6.6vw;font-weight:900;line-height:1;text-align:center;font-variant-numeric:tabular-nums;margin-top:1vw}
#side .date{text-align:center;font-size:2vw;opacity:.9;line-height:1.35}
#side .box{background:#ffffff14;border-radius:1vw;padding:1.3vw;font-size:1.9vw;line-height:1.35}
#side .box b{display:block;font-size:1.6vw;opacity:.7;font-weight:700;margin-bottom:.3vw}
#side .box .big{font-size:3vw;font-weight:900;font-variant-numeric:tabular-nums}
#urg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#7a1313,#d03a3a);color:#fff;z-index:50;gap:1.5vw;padding:5vw}
#urg.show{display:flex}
#urg::before{content:"";position:absolute;inset:1.2vw;border:.6vw solid #ffffffcc;border-radius:1.4vw}
#urg .tag{font-size:2.4vw;font-weight:900;background:#fff;color:#7a1313;border-radius:99px;padding:.4vw 2vw}
#urg .h{font-size:10vw;font-weight:900;line-height:1.05}
#urg .p{font-size:3.6vw;line-height:1.35}
</style>
</head>
<body>
<div id="stage"></div>
<div id="side"><div class="logo"><i id="sl"></i><span id="sn"></span></div><div><div class="clock" id="sc"></div><div class="date" id="sd"></div></div><div id="ss"></div></div>
<div id="tick"></div>
<div id="urg"></div>
<div id="msg"></div>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var C = window.CONFIG || {}, T = new URLSearchParams(location.search).get('t') || '';
  var VER = '1.2', KEY = 'pd:' + T, data = null, list = [], idx = -1, timer = null;
  function $(i){ return document.getElementById(i); }
  function el(t, c, x){ var e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; }
  function say(t, sub){ var m = $('msg'); m.textContent = ''; if(t){ m.appendChild(el('div', 'mt', t)); if(sub) m.appendChild(el('div', 'ms', sub)); m.style.display = 'grid'; } else m.style.display = 'none'; }

  function jer(){
    var p = {}, f = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Jerusalem', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false, weekday:'short'});
    f.formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    var h = p.hour === '24' ? '00' : p.hour;
    return {date:p.year + '-' + p.month + '-' + p.day, hour:+h, min:+p.minute, dow:p.weekday, stamp:p.year + '-' + p.month + '-' + p.day + 'T' + h + ':' + p.minute};
  }
  function minusDays(iso, n){ var q = iso.split('-').map(Number), d = new Date(Date.UTC(q[0], q[1] - 1, q[2] - n)); return d.toISOString().slice(0, 10); }

  function slideOk(s, n){
    if(s.from && n.date < s.from) return false;
    if(s.to && n.date > s.to) return false;
    var h = n.hour, fri = n.dow === 'Fri', sat = n.dow === 'Sat';
    switch(s.period){
      case 'm': return h < 12;
      case 'n': return h >= 12 && h < 17;
      case 'e': return h >= 17;
      case 'w': return !fri && !sat;
      case 'f': return fri;
      default: return true;
    }
  }
  function activeShabbat(n){
    var rows = (data.shabbat || []);
    for(var i = 0; i < rows.length; i++){
      var r = rows[i], start = minusDays(r.eve, 3) + 'T00:00', end = r.end + 'T' + r.havdalah;
      if(n.stamp >= start && n.stamp <= end) return r;
    }
    return null;
  }
  function dmy(iso){ var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function shabbatNode(r){
    var holiday = r.title && !/^פרשת\s/.test(r.title), noun = holiday ? 'החג' : 'שבת';
    var d = el('div', 'slide shab'), inn = el('div', 'in');
    inn.appendChild(el('h1', null, holiday ? 'זמני חג' : 'זמני שבת'));
    if(r.title) inn.appendChild(el('div', 'big', r.title.replace(/^פרשת\s+/, '')));
    var t = el('div', 'times');
    [['כניסת ' + noun, r.candle, 'ערב ' + noun + ' ' + dmy(r.eve)], ['יציאת ' + noun, r.havdalah, dmy(r.end)]].forEach(function(x){
      var b = el('div', 't'); b.appendChild(el('span', null, x[0])); b.appendChild(el('b', null, x[1])); b.appendChild(el('span', null, x[2])); t.appendChild(b);
    });
    inn.appendChild(t); inn.appendChild(el('div', 'd', holiday ? 'חג שמח!' : 'שבת שלום ומבורך!'));
    d.appendChild(inn); return d;
  }
  function imgUrl(p){ return C.url + '/storage/v1/object/public/slides/' + encodeURI(p); }
  var warmed = {};
  function prefetch(d){ (d.slides || []).forEach(function(s){ var u = imgUrl(s.path); if(warmed[u]) return; warmed[u] = 1; fetch(u, {mode:'cors'}).catch(function(){ delete warmed[u]; }); }); }

  function build(){
    var n = jer(), out = [], sh = activeShabbat(n);
    (data.slides || []).forEach(function(s){ if(slideOk(s, n)) out.push({kind:'img', s:s}); });
    if(sh){ out.splice(Math.min(1, out.length), 0, {kind:'shab', r:sh}); }
    return out;
  }
  function show(){
    var st = $('stage'); clearTimeout(timer);
    list = build();
    if(!list.length){
      if(!st.querySelector('.idle')){ st.textContent = ''; var d0 = el('div', 'slide shab idle on'), i0 = el('div', 'in'); i0.appendChild(el('h1', null, (data && data.name) || 'ברוכים הבאים')); d0.appendChild(i0); st.appendChild(d0); }
      timer = setTimeout(show, 15000); return;
    }
    idx = (idx + 1) % list.length;
    var it = list[idx], node;
    if(it.kind === 'shab') node = shabbatNode(it.r);
    else { node = el('div', 'slide'); var split = document.body.classList.contains('split'); if(split){ var bg = new Image(); bg.alt = ''; bg.className = 'bgb'; bg.src = imgUrl(it.s.path); node.appendChild(bg); } var im = new Image(); im.alt = ''; im.className = 'fg'; im.src = imgUrl(it.s.path); node.appendChild(im); }
    st.appendChild(node);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ node.classList.add('on'); }); });
    var prev = st.querySelectorAll('.slide');
    for(var i = 0; i < prev.length - 1; i++){ (function(p){ p.classList.remove('on'); setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, 1000); })(prev[i]); }
    timer = setTimeout(show, (it.kind === 'shab' ? 9 : (it.s.dur || 8)) * 1000);
  }


  /* display settings: layout, accent color, transition */
  function display(){
    var ds = (data && data.display) || {}, b = document.body, st = $('stage');
    b.classList.toggle('split', ds.layout === 'split');
    b.style.setProperty('--acc', /^#[0-9a-fA-F]{6}$/.test(ds.accent || '') ? ds.accent : '#6c93ff');
    st.classList.remove('fx-slide', 'fx-zoom'); if(ds.transition === 'slide') st.classList.add('fx-slide'); if(ds.transition === 'zoom') st.classList.add('fx-zoom');
  }
  function renderUrgent(){
    var u = data && data.urgent, b = $('urg');
    if(!u){ b.classList.remove('show'); return; }
    b.textContent = ''; b.appendChild(el('span', 'tag', 'הודעה דחופה')); b.appendChild(el('div', 'h', u.title)); if(u.body) b.appendChild(el('div', 'p', u.body)); b.classList.add('show');
  }
  function gem(n, year){
    var L = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']], s = '';
    if(n === 15) s = 'טו'; else if(n === 16) s = 'טז';
    else { L.forEach(function(x){ while(n >= x[0]){ s += x[1]; n -= x[0]; } }); }
    if(year){ var m = s.match(/^(ט[וז])(.*)$/); }
    return s.length > 1 ? s.slice(0, -1) + '״' + s.slice(-1) : s + '׳';
  }
  function side(){
    if(!document.body.classList.contains('split') || !data) return;
    var nm = data.name || '';
    $('sn').textContent = nm; $('sl').textContent = nm.charAt(0);
    var d = new Date(), tz = {timeZone:'Asia/Jerusalem'};
    $('sc').textContent = new Intl.DateTimeFormat('he-IL', {timeZone:'Asia/Jerusalem', hour:'2-digit', minute:'2-digit', hour12:false}).format(d);
    var g = new Intl.DateTimeFormat('he-IL', {timeZone:'Asia/Jerusalem', weekday:'long', day:'numeric', month:'long'}).format(d), h = '';
    try{
      var hp = {}; new Intl.DateTimeFormat('he-IL-u-ca-hebrew', {timeZone:'Asia/Jerusalem', day:'numeric', month:'long', year:'numeric'}).formatToParts(d).forEach(function(x){ hp[x.type] = x.value; });
      h = gem(+hp.day) + ' ב' + String(hp.month).replace(/^ב/, '') + ' ' + gem((+String(hp.year).replace(/\D/g, '')) % 1000, true);
    }catch(e){}
    $('sd').textContent = ''; $('sd').appendChild(document.createTextNode(g)); if(h){ $('sd').appendChild(document.createElement('br')); $('sd').appendChild(document.createTextNode(h)); }
    var box = $('ss'); box.textContent = '';
    var n = jer(), rows = (data.shabbat || []).filter(function(r){ return r.end >= n.date; }), r = rows[0];
    if(r){
      var holiday = r.title && !/^פרשת\s/.test(r.title), bx = el('div', 'box');
      bx.appendChild(el('b', null, (holiday ? 'כניסת החג' : 'כניסת שבת') + (r.title ? ' · ' + r.title.replace(/^פרשת\s+/, '') : '')));
      bx.appendChild(el('span', 'big', r.candle)); bx.appendChild(document.createTextNode('  ' + (holiday ? 'צאת החג ' : 'צאת השבת ') + r.havdalah)); box.appendChild(bx);
    }
  }
  setInterval(side, 10000);

  var tk = 0;
  function ticker(){
    var s = (data && data.settings) || {}, mode = s.ticker_mode || 'off', box = $('tick');
    var msgs = [], tor = (s.torah || []).filter(Boolean);
    if((mode === 'msg' || mode === 'both') && s.message) msgs.push(s.message);
    if((mode === 'torah' || mode === 'both') && tor.length) msgs.push(tor[tk++ % tor.length]);
    if(!data || !msgs.length || (data.modules || []).indexOf('ticker') < 0){ box.style.display = 'none'; return; }
    box.textContent = msgs.join('   •   '); box.style.display = 'block';
  }
  setInterval(ticker, 12000);

  /* remote command from the admin screen: a new cmd_id means act once */
  function handleCmd(d){
    try{
      if(!d || d.cmd_id == null) return false;
      var k = 'cmd:' + T, last = localStorage.getItem(k);
      localStorage.setItem(k, String(d.cmd_id));
      if(last !== null && String(d.cmd_id) !== last && d.cmd === 'reload'){ location.reload(); return true; }
    }catch(e){}
    return false;
  }
  function pull(){
    if(!T){ say('חסר קוד מסך בכתובת'); return; }
    fetch(C.url + '/rest/v1/rpc/player_data', {method:'POST', headers:{'apikey':C.key, 'Authorization':'Bearer ' + C.key, 'Content-Type':'application/json'}, body:JSON.stringify({p_token:T, p_ver:VER})})
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} if(handleCmd(d)) return; apply(d); })
      .catch(function(){ if(!data){ try{ var c = localStorage.getItem(KEY); if(c) apply(JSON.parse(c)); else { say('מתחבר...', 'ממתין לחיבור לאינטרנט'); setTimeout(pull, 10000); } }catch(e){ say('מתחבר...', 'ממתין לחיבור לאינטרנט'); setTimeout(pull, 10000); } } });
  }
  function apply(d){
    if(!d || !d.ok){ say('קוד מסך לא תקין'); return; }
    if(d.active === false){ data = d; clearTimeout(timer); timer = null; $('stage').textContent = ''; $('tick').style.display = 'none'; say('המסך ממתין לחידוש המנוי', 'לחידוש השירות: מיכאל מערכות, 053-4339050'); return; }
    say(''); var first = !data || !data.slides; var wasSplit = document.body.classList.contains('split'); data = d; display(); renderUrgent(); prefetch(d); if(first || !timer || wasSplit !== document.body.classList.contains('split')){ idx = -1; clearTimeout(timer); $('stage').textContent = ''; show(); } ticker(); side();
  }
  pull(); setInterval(pull, 30000);
  setInterval(function(){
    try{ var n = jer(), k = 'reload:' + n.date; if(n.hour === 4 && n.min < 5 && !localStorage.getItem(k)){ localStorage.setItem(k, '1'); location.reload(); } }catch(e){}
  }, 60000);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
