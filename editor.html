<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>עורך תמונה למסך</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Assistant:wght@400;700;800&family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@400;500;700;800&family=Rubik:wght@400;500;700&family=Secular+One&family=Suez+One&family=Varela+Round&display=swap">
<style>
/* Layout: top bar, left tool rail with panel, center 16:9 stage, right properties panel. Under 900px it stacks: stage first, tool tabs, then panels. */
:root{--bg:#e9edf3;--panel:#ffffff;--ink:#14202e;--mute:#5a6878;--line:#d9e0e8;--brand:#1f4fd8;--onbrand:#ffffff;--soft:#e6ecf6;--danger:#b3261e;--stagebg:#cfd6e0;
  --display:'Rubik','Heebo',sans-serif;--body:'Heebo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141d;--panel:#16202c;--ink:#e8edf3;--mute:#9aa8b8;--line:#263344;--brand:#6c93ff;--onbrand:#0b1220;--soft:#1d2a3a;--danger:#ff8f86;--stagebg:#0a1018;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d141d;--panel:#16202c;--ink:#e8edf3;--mute:#9aa8b8;--line:#263344;--brand:#6c93ff;--onbrand:#0b1220;--soft:#1d2a3a;--danger:#ff8f86;--stagebg:#0a1018;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:grid;gap:10px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.top h1{font-family:var(--display);font-size:16px;margin:0;margin-inline-end:auto}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[aria-pressed="true"],.btn.on{background:var(--soft);border-color:var(--brand)}
.btn[disabled]{opacity:.4;cursor:default}
.main{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:10px;align-items:start}
@media(max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.left{order:2}.center{order:1}.right{order:3}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;font-weight:700;font-size:12px}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
h3{font-size:12px;margin:12px 0 6px;color:var(--mute);font-weight:800}
h3:first-child{margin-top:0}
.stagewrap{background:var(--stagebg);border-radius:12px;padding:10px}
.stage{position:relative;width:100%;aspect-ratio:16/9;direction:ltr;overflow:hidden;border-radius:4px;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.cv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.bgl,.ovl{position:absolute;inset:0}
.el{position:absolute;touch-action:none;cursor:move}
.el.sel{outline:3px solid #3b82f6;outline-offset:0}
.el .tx{width:100%;white-space:pre-wrap;word-break:break-word;outline:none}
.el img{width:100%;height:100%;display:block;pointer-events:none}
.h{position:absolute;width:34px;height:34px;background:#fff;border:4px solid #3b82f6;border-radius:50%;touch-action:none}
.h.nw{left:-17px;top:-17px;cursor:nwse-resize}.h.ne{right:-17px;top:-17px;cursor:nesw-resize}
.h.sw{left:-17px;bottom:-17px;cursor:nesw-resize}.h.se{right:-17px;bottom:-17px;cursor:nwse-resize}
.h.e{right:-17px;top:calc(50% - 17px);border-radius:10px;width:24px;cursor:ew-resize}.h.w{left:-17px;top:calc(50% - 17px);border-radius:10px;width:24px;cursor:ew-resize}
.rot{position:absolute;left:calc(50% - 17px);top:-80px;width:34px;height:34px;background:#3b82f6;border-radius:50%;cursor:grab;touch-action:none}
.rot::after{content:"";position:absolute;left:15px;top:34px;width:4px;height:46px;background:#3b82f6}
.guide{position:absolute;background:#ff3b9a;pointer-events:none;display:none}
.guide.v{width:3px;top:0;bottom:0}.guide.hz{height:3px;left:0;right:0}
.safe{position:absolute;inset:54px 96px;border:3px dashed #ffffffaa;pointer-events:none;display:none}
.grid{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(#ffffff22 2px,transparent 2px),linear-gradient(90deg,#ffffff22 2px,transparent 2px);background-size:120px 120px}
.preview .h,.preview .rot{display:none}.preview .el.sel{outline:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumb{border:2px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:#000;aspect-ratio:16/9;position:relative;min-width:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;inset:auto 0 0 0;background:#000a;color:#fff;font-size:10px;padding:1px 4px;text-align:center}
.thumb.on{border-color:var(--brand)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--brand);outline-offset:1px}
label.f{display:grid;gap:3px;font-size:12px;font-weight:700;color:var(--mute);min-width:0}
label.f.inl{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
select,input[type=number],input[type=text],textarea{font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;width:100%}
input[type=range]{width:100%;accent-color:var(--brand)}
input[type=color]{width:34px;height:30px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:var(--panel)}
.note{font-size:12px;color:var(--mute)}
.badge{font-size:11px;font-weight:800;background:var(--soft);color:var(--brand);border-radius:99px;padding:1px 8px}
.sheet{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:20}
.sheet.show{display:grid}
.sheet .box{background:var(--panel);border-radius:14px;padding:16px;width:min(420px,100%);display:grid;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
#toast{position:fixed;inset-inline:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}a.btn.p{color:var(--onbrand)}
</style>

</head><body>
<div class="app" dir="rtl" lang="he">
  <div class="top">
    <h1>עורך תמונה למסך</h1>
    <a class="btn" id="back" href="index.html">חזרה לניהול</a>
    <input type="text" id="dname" value="עיצוב ללא שם" aria-label="שם העיצוב" style="width:160px;padding:6px 9px"><button class="btn" id="saveD" type="button">שמור</button>
    <button class="btn" id="undo" type="button">בטל</button>
    <button class="btn" id="redo" type="button">חזור</button>
    <button class="btn" id="tglGrid" type="button" aria-pressed="false">רשת</button>
    <button class="btn" id="tglSafe" type="button" aria-pressed="false">שוליים בטוחים</button>
    <button class="btn" id="tglPrev" type="button" aria-pressed="false">תצוגה כמו בטלוויזיה</button>
    <button class="btn p" id="addToScreen" type="button">הוסף למסך</button>
  </div>
  <div class="main">
    <div class="card left">
      <div class="tabs" id="ltabs" role="tablist">
        <button role="tab" data-t="bg" aria-selected="true">רקע</button>
        <button role="tab" data-t="text" aria-selected="false">טקסט</button>
        <button role="tab" data-t="img" aria-selected="false">תמונות</button>
        <button role="tab" data-t="shape" aria-selected="false">צורות</button>
        <button role="tab" data-t="tpl" aria-selected="false">תבניות</button>
        <button role="tab" data-t="mine" aria-selected="false">שמורים</button>
      </div>
      <div id="lpanel"></div>
    </div>
    <div class="center">
      <div class="stagewrap">
        <div class="stage" id="stage">
          <div class="cv" id="cv">
            <div class="bgl" id="bgl"></div><div class="ovl" id="ovl"></div>
            <div id="els"></div>
            <div class="grid" id="gridL"></div><div class="safe" id="safeL"></div>
            <div class="guide v" id="gv"></div><div class="guide hz" id="gh"></div>
          </div>
        </div>
      </div>
      <p class="note" style="margin:6px 4px 0">לחיצה כפולה על טקסט לעריכה. גררו כדי להזיז, פינות להגדלה, העיגול העליון לסיבוב. מקשי החצים מזיזים בעדינות.</p>
    </div>
    <div class="card right" id="props"></div>
  </div>
</div>
<div class="sheet" id="sheet"><div class="box">
  <b style="font-size:16px">הוספה למסך</b>
  <div><b>מתי להציג</b><div class="chips" id="whenChips"></div></div>
  <label class="f">שניות על המסך<input type="number" id="durIn" value="8" min="3" max="60"></label>
  <div class="row"><button class="btn p" id="sheetOk" type="button">הוסף</button><button class="btn" id="sheetNo" type="button">ביטול</button></div>
</div></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=13"></script>
<script src="cats.js?v=13"></script>
<script>
(function(){

  var SW=['#ffffff','#14202e','#c4560a','#e8873a','#f2c14e','#3d9a78','#1f4fd8','#6c93ff','#7a1f3d','#d0647f','#7a5acd','#101010'];
  var GRADS=[['#14305f','#2b5bb3'],['#a33a12','#e8873a'],['#17463a','#3d9a78'],['#5a1830','#c04a6a'],['#2c2c54','#6a5acd'],['#10161f','#2c3a52'],['#7a4a1a','#e8c07a'],['#0b6b7a','#6ad0c4']];

  /* sample picture gallery, drawn as SVG (stand-ins for real photos) */

    if(kind==='sun')s+='<circle cx="1400" cy="420" r="190" fill="#fff6" /><path d="M0 820 Q480 640 960 790 T1920 760 V1080 H0Z" fill="#0004"/><path d="M0 930 Q520 780 1000 900 T1920 880 V1080 H0Z" fill="#0006"/>';
    if(kind==='city')s+='<g fill="#0005"><rect x="120" y="500" width="220" height="580"/><rect x="380" y="320" width="260" height="760"/><rect x="680" y="580" width="200" height="500"/><rect x="920" y="420" width="300" height="660"/><rect x="1260" y="560" width="240" height="520"/><rect x="1540" y="360" width="280" height="720"/></g>';
    if(kind==='stars')for(var i=0;i<40;i++){s+='<circle cx="'+((i*389)%1920)+'" cy="'+((i*197)%700)+'" r="'+(3+(i%4)*3)+'" fill="#fff9"/>'}

    if(kind==='dots')for(var j=0;j<60;j++){s+='<circle cx="'+((j*313)%1920)+'" cy="'+((j*211)%1080)+'" r="'+(20+(j%5)*14)+'" fill="#fff2"/>'}
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(s+'</svg>');
  }
  var GAL=[['בוקר',svgPic('#f6c177','#e8873a','sun'),'sun'],['עיר',svgPic('#1b3b5e','#4a86d0','city'),'city'],['לילה',svgPic('#0b1220','#2c2c54','stars'),'stars'],['ים',svgPic('#0b6b7a','#6ad0c4','wave'),'wave'],['ורוד',svgPic('#7a1f3d','#e8a0b4','dots'),'dots'],['ירוק',svgPic('#17463a','#9ad0b0','sun'),'sun'],['קפה',svgPic('#3d2b1a','#c98b3c','dots'),'dots'],['שמיים',svgPic('#2b5bb3','#cfe3ff','wave'),'wave']];

  /* ---------- state ---------- */
  var S={bg:{type:'gradient',a:'#14305f',b:'#2b5bb3',color:'#14305f',src:'',overlay:0,blur:0},els:[],sel:null};

  $('#undo').addEventListener('click',function(){if(hi>0){hi--;restore(hist[hi]);syncHist()}});
  $('#redo').addEventListener('click',function(){if(hi<hist.length-1){hi++;restore(hist[hi]);syncHist()}});
  function cur(){return S.els.filter(function(e){return e.id===S.sel})[0]}

  /* ---------- element factories ---------- */
  function newText(txt,o){var e={id:uid++,type:'text',text:txt,x:260,y:380,w:1400,fs:110,fw:700,it:false,ul:false,color:'#ffffff',align:'center',lh:1.15,ls:0,font:'Heebo',shadow:false,op:1,bgOn:false,bgColor:'#000000',pad:24,radius:16,rot:0};for(var k in o)e[k]=o[k];return e}
  function newImg(src,o){var e={id:uid++,type:'image',src:src,x:560,y:240,w:800,h:600,op:1,radius:0,flip:false,bright:100,fit:'cover',rot:0};for(var k in o)e[k]=o[k];return e}
  function newShape(shape,o){var e={id:uid++,type:'shape',shape:shape,x:760,y:400,w:400,h:280,fill:'#f2c14e',op:1,radius:shape==='rect'?24:0,rot:0};if(shape==='circle'){e.w=e.h=360}if(shape==='line'){e.w=700;e.h=10;e.radius=5}for(var k in o)e[k]=o[k];return e}
  function add(e){S.els.push(e);S.sel=e.id;commit();render();drawProps()}

  /* ---------- render ---------- */
  var stage=$('#stage'),cv=$('#cv'),elsL=$('#els');
  function fit(){var k=stage.getBoundingClientRect().width/W;cv.style.transform='scale('+k+')'}
  window.addEventListener('resize',fit);

  function render(){
    var b=S.bg,bl=$('#bgl');
    bl.style.cssText='';bl.style.position='absolute';bl.style.inset='0';
    if(b.type==='gradient')bl.style.background='linear-gradient(135deg,'+b.a+','+b.b+')';

    else bl.style.cssText+=';background:url("'+b.src+'") center/cover no-repeat;'+(b.blur?'filter:blur('+b.blur+'px);transform:scale(1.08)':'');
    $('#ovl').style.background='rgba(0,0,0,'+b.overlay+')';
    elsL.textContent='';
    S.els.forEach(function(e){
      var d=el('div','el'+(e.id===S.sel?' sel':''));d.dataset.id=e.id;
      d.style.left=e.x+'px';d.style.top=e.y+'px';d.style.width=e.w+'px';

      if(e.type==='text'){

  /* ---------- pointer interactions ---------- */
  var drag=null;
  stage.addEventListener('pointerdown',function(ev){
    var t=ev.target,h=t.closest('[data-h]'),d=t.closest('.el');

    if(!drag)return;var e=cur();if(!e)return;
    var dx=(ev.clientX-drag.sx)/drag.k,dy=(ev.clientY-drag.sy)/drag.k,o=drag.o,m=drag.mode;drag.moved=true;

      var x=o.x+dx,y=o.y+dy,w=e.w,hh=e.type==='text'?drag.h:e.h,gx=false,gy=false;
      var xs=[[0,x],[W/2-w/2,x],[W-w,x]],T=10;
      [[(W-w)/2,'c'],[96,'l'],[W-96-w,'r']].forEach(function(c){if(!gx&&Math.abs(x-c[0])<T){x=c[0];gx=c[1]==='c'?W/2:(c[1]==='l'?96:W-96)}});

      var gv=$('#gv'),gh=$('#gh');gv.style.display=gx!==false?'block':'none';gh.style.display=gy!==false?'block':'none';

      var a=Math.atan2(ev.clientY-drag.cy,ev.clientX-drag.cx)*180/Math.PI+90;a=Math.round(a);if(a>180)a-=360;
